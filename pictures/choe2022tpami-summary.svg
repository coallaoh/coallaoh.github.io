<svg xmlns="http://www.w3.org/2000/svg" width="480" height="320" viewBox="0 0 480 320" role="img"><title>Separate image labels used for training from location labels used for evaluation</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#627984"/></marker></defs><rect width="480" height="320" rx="18" fill="#f3f7f8"/><g font-family="Arial, sans-serif"><text x="240" y="38" font-size="23" fill="#193d49" text-anchor="middle">Evaluate object localisation fairly</text><rect x="25" y="85" width="190" height="148" rx="12" fill="#e2efe9"/><text x="120" y="121" font-size="22" fill="#193d49" text-anchor="middle">Training</text><text x="120" y="165" font-size="21" fill="#193d49" text-anchor="middle">Image labels</text><text x="120" y="202" font-size="19" fill="#193d49" text-anchor="middle">“Bird present”</text><rect x="265" y="85" width="190" height="148" rx="12" fill="#e3eafa"/><text x="360" y="121" font-size="22" fill="#193d49" text-anchor="middle">Evaluation</text><rect x="325" y="145" width="70" height="55" rx="2" fill="none" stroke="#3a71be" stroke-width="4"/><text x="240" y="285" font-size="23" fill="#193d49" text-anchor="middle">Keep the supervision explicit</text></g></svg>
