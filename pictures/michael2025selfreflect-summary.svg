<svg xmlns="http://www.w3.org/2000/svg" width="480" height="320" viewBox="0 0 480 320" role="img"><title>A written summary should reflect the model’s range of possible answers</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#627984"/></marker></defs><rect width="480" height="320" rx="18" fill="#f3f7f8"/><g font-family="Arial, sans-serif"><text x="240" y="38" font-size="23" fill="#193d49" text-anchor="middle">Does the summary reflect uncertainty?</text><rect x="28" y="90" width="160" height="180" rx="12" fill="#fff"/><text x="108" y="117" font-size="17" fill="#193d49" text-anchor="middle">Possible answers</text><rect x="48" y="145" width="27" height="85" rx="4" fill="#208778"/><rect x="90" y="165" width="27" height="65" rx="4" fill="#3a71be"/><rect x="132" y="190" width="27" height="40" rx="4" fill="#3a71be"/><path d="M204 176 L260 176" fill="none" stroke="#627984" stroke-width="4" marker-end="url(#arrow)"/><rect x="282" y="107" width="168" height="130" rx="12" fill="#e3eafa"/><text x="366" y="151" font-size="20" fill="#193d49" text-anchor="middle">“Probably A,</text><text x="366" y="182" font-size="20" fill="#193d49" text-anchor="middle">but B or C</text><text x="366" y="213" font-size="20" fill="#193d49" text-anchor="middle">could fit.”</text></g></svg>
