<svg xmlns="http://www.w3.org/2000/svg" width="480" height="320" viewBox="0 0 480 320" role="img"><title>Uncertainty can disappear when one agent passes an answer to another</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#627984"/></marker></defs><rect width="480" height="320" rx="18" fill="#f3f7f8"/><g font-family="Arial, sans-serif"><text x="240" y="38" font-size="23" fill="#193d49" text-anchor="middle">Do doubts travel with an answer?</text><rect x="25" y="90" width="175" height="115" rx="12" fill="#e2efe9"/><text x="112.5" y="154.5" font-size="22" fill="#193d49" text-anchor="middle">Agent A</text><rect x="280" y="90" width="175" height="115" rx="12" fill="#e3eafa"/><text x="367.5" y="154.5" font-size="22" fill="#193d49" text-anchor="middle">Agent B</text><path d="M210 145 L265 145" fill="none" stroke="#627984" stroke-width="4" marker-end="url(#arrow)"/><text x="112" y="248" font-size="24" fill="#627984" text-anchor="middle">“Maybe…”</text><text x="366" y="248" font-size="24" fill="#bb5960" text-anchor="middle">“Certainly.”</text></g></svg>
