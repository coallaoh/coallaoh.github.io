<svg xmlns="http://www.w3.org/2000/svg" width="480" height="320" viewBox="0 0 480 320" role="img"><title>Estimate confidence using only a question and a model’s answer</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#627984"/></marker></defs><rect width="480" height="320" rx="18" fill="#f3f7f8"/><g font-family="Arial, sans-serif"><text x="240" y="38" font-size="23" fill="#193d49" text-anchor="middle">Confidence from the text alone</text><rect x="25" y="87" width="190" height="57" rx="12" fill="#e2efe9"/><text x="120.0" y="122.5" font-size="22" fill="#193d49" text-anchor="middle">Question</text><rect x="25" y="171" width="190" height="57" rx="12" fill="#e2efe9"/><text x="120.0" y="206.5" font-size="22" fill="#193d49" text-anchor="middle">Model answer</text><path d="M230 118 L285 151" fill="none" stroke="#627984" stroke-width="4" marker-end="url(#arrow)"/><path d="M230 200 L285 167" fill="none" stroke="#627984" stroke-width="4" marker-end="url(#arrow)"/><rect x="295" y="122" width="160" height="82" rx="12" fill="#e3eafa"/><text x="375.0" y="170.0" font-size="21" fill="#193d49" text-anchor="middle">Confidence</text><text x="240" y="280" font-size="21" fill="#193d49" text-anchor="middle">No access to internal model scores</text></g></svg>
