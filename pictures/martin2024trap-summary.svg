<svg xmlns="http://www.w3.org/2000/svg" width="480" height="320" viewBox="0 0 480 320" role="img"><title>A distinctive prompt-response pattern can identify a hidden language model</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#627984"/></marker></defs><rect width="480" height="320" rx="18" fill="#f3f7f8"/><g font-family="Arial, sans-serif"><text x="240" y="38" font-size="23" fill="#193d49" text-anchor="middle">Identify a model through its answers</text><rect x="20" y="125" width="120" height="70" rx="12" fill="#e2efe9"/><text x="80.0" y="167.0" font-size="20" fill="#193d49" text-anchor="middle">Prompt</text><path d="M150 161 L185 161" fill="none" stroke="#627984" stroke-width="4" marker-end="url(#arrow)"/><rect x="198" y="98" width="116" height="127" rx="12" fill="#e3eafa"/><text x="256.0" y="168.5" font-size="55" fill="#193d49" text-anchor="middle">?</text><path d="M324 161 L358 161" fill="none" stroke="#627984" stroke-width="4" marker-end="url(#arrow)"/><rect x="370" y="125" width="95" height="70" rx="12" fill="#e2efe9"/><text x="417.5" y="167.0" font-size="20" fill="#193d49" text-anchor="middle">Reply</text><text x="240" y="277" font-size="23" fill="#193d49" text-anchor="middle">A distinctive response is a clue</text></g></svg>
