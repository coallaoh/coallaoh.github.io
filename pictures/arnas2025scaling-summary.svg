<svg xmlns="http://www.w3.org/2000/svg" width="480" height="320" viewBox="0 0 480 320" role="img"><title>Diverse combinations of concepts matter more than repeated examples</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#627984"/></marker></defs><rect width="480" height="320" rx="18" fill="#f3f7f8"/><g font-family="Arial, sans-serif"><text x="240" y="38" font-size="23" fill="#193d49" text-anchor="middle">More examples, or more variety?</text><text x="120" y="86" font-size="20" fill="#193d49" text-anchor="middle">Repeated</text><text x="360" y="86" font-size="20" fill="#193d49" text-anchor="middle">Varied</text><circle cx="62" cy="128" r="17" fill="#208778"/><circle cx="120" cy="128" r="17" fill="#208778"/><circle cx="178" cy="128" r="17" fill="#208778"/><circle cx="62" cy="188" r="17" fill="#208778"/><circle cx="120" cy="188" r="17" fill="#208778"/><circle cx="178" cy="188" r="17" fill="#208778"/><circle cx="302" cy="128" r="17" fill="#208778"/><circle cx="360" cy="128" r="17" fill="#3a71be"/><circle cx="418" cy="128" r="17" fill="#cb9741"/><rect x="285" y="171" width="34" height="34" fill="#208778"/><rect x="343" y="171" width="34" height="34" fill="#3a71be"/><rect x="401" y="171" width="34" height="34" fill="#cb9741"/><text x="240" y="276" font-size="22" fill="#193d49" text-anchor="middle">Learn concepts that can recombine</text></g></svg>
