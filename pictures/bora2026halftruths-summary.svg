<svg xmlns="http://www.w3.org/2000/svg" width="480" height="320" viewBox="0 0 480 320" role="img"><title>A correct description becomes a half-truth when a false object is added</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#627984"/></marker></defs><rect width="480" height="320" rx="18" fill="#f3f7f8"/><g font-family="Arial, sans-serif"><text x="240" y="38" font-size="23" fill="#193d49" text-anchor="middle">A true detail + a false detail</text><rect x="30" y="70" width="130" height="180" rx="12" fill="#fff"/><path d="M95 105 L50 190 L140 190 Z" fill="#208778"/><path d="M175 150 L210 150" fill="none" stroke="#627984" stroke-width="4" marker-end="url(#arrow)"/><text x="330" y="110" font-size="21" fill="#208778" text-anchor="middle">A green triangle</text><text x="330" y="157" font-size="21" fill="#193d49" text-anchor="middle">A green triangle</text><text x="330" y="188" font-size="21" fill="#bb5960" text-anchor="middle">and a red square</text><path d="M233 207 L435 207" fill="none" stroke="#bb5960" stroke-width="3"/><text x="240" y="287" font-size="22" fill="#193d49" text-anchor="middle">Does the extra detail really fit?</text></g></svg>
