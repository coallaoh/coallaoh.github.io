<svg xmlns="http://www.w3.org/2000/svg" width="480" height="320" viewBox="0 0 480 320" role="img"><title>Ask practitioners which training-data explanations would help their work</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#627984"/></marker></defs><rect width="480" height="320" rx="18" fill="#f3f7f8"/><g font-family="Arial, sans-serif"><text x="240" y="38" font-size="23" fill="#193d49" text-anchor="middle">What explanations do people need?</text><rect x="25" y="90" width="195" height="120" rx="12" fill="#e2efe9"/><text x="122" y="137" font-size="20" fill="#193d49" text-anchor="middle">Training examples</text><text x="122" y="172" font-size="18" fill="#193d49" text-anchor="middle">behind a prediction</text><path d="M233 150 L267 150" fill="none" stroke="#627984" stroke-width="4" marker-end="url(#arrow)"/><rect x="280" y="90" width="175" height="120" rx="12" fill="#e3eafa"/><text x="367" y="137" font-size="21" fill="#193d49" text-anchor="middle">Practitioner</text><text x="367" y="172" font-size="21" fill="#193d49" text-anchor="middle">questions</text><text x="240" y="280" font-size="22" fill="#193d49" text-anchor="middle">Start with the people who use them</text></g></svg>
